version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: omnidesk_mongodb
    ports:
      - '27017:27017'
    # Start replica set for change streams (crucial for real-time features)
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: test $$(echo "rs.initiate({_id:'rs0',members:[{_id:0,host:\"mongodb:27017\"}]}).ok || rs.status().ok" | mongo --port 27017 --quiet) -eq 1
      interval: 10s
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: omnidesk_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    # Optional but recommended: persistence and performance tuning
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
